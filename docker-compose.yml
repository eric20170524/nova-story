services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/sql_app.db
      NOVASTORY_DATA_DIR: /data
      NOVASTORY_CONFIG_DIR: /data
      NOVASTORY_STATIC_DIR: /data/static
      REDIS_URL: redis://redis:6379/0
      AI_IMAGE_PROVIDER: ${AI_IMAGE_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
    ports:
      - "8087:8087"
    volumes:
      - backend_data:/data
    depends_on:
      - redis

  frontend:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
  redis_data:
